name: Auto-update strict branch

# Applies the strict flavor patch (build-scripts/patches/strict/apply) on top
# of every maintained branch and pushes the result to
# autoupdate/<branch>-strict, so Launchpad recipes (which cannot run
# pre-build commands) have a ready-made strict tree to build.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: read

jobs:
  apply-strict-flavor:
    name: Apply strict flavor to ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          # Keep main branch up to date
          - main
          # Supported release branches
          - release-1.36
          - release-1.35
          - release-1.34
          - release-1.33
          - release-1.32
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          ssh-key: ${{ secrets.BOT_SSH_KEY }}

      - name: Apply and push the strict flavor
        env:
          TARGET_BRANCH: autoupdate/${{ matrix.branch }}-strict
        run: |
          git config user.name "K8s builder bot"
          git config user.email "k8s-bot@canonical.com"
          ./build-scripts/patches/strict/apply
          git add -A
          if git diff --cached --quiet; then
            echo "${TARGET_BRANCH} is already up to date"
            exit 0
          fi
          git commit -qm "autoupdate: apply strict flavor patch to ${{ matrix.branch }}"
          # Generated branch: force-push is expected, it always mirrors the
          # source branch tip plus the strict patch.
          git push --force-with-lease origin "HEAD:refs/heads/${TARGET_BRANCH}"
